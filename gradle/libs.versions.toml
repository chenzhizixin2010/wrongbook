[versions]
# —— 构建工具链 ——
agp = "9.5.1"
kotlin = "2.3.21"
ksp = "2.3.14"
# 说明：KSP 2.x 起独立版本号；若编译报 KSP 与 Kotlin 不匹配，改回 <kotlin>-<ksp> 形式。

# —— AndroidX / Compose ——
composeBom = "2026.09.00"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
workRuntime = "2.12.0"
camera = "1.7.0"
datastore = "1.3.0"
securityCrypto = "1.1.0"

# —— DI / 数据库 ——
# Hilt 2.60.1 起 Gradle 插件要求 AGP 9.0+；本项目用 AGP 9.5.1，故与之配套。
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
room = "2.8.5"

# —— iOS 风格 UI（Compose Multiplatform 生态）——
cupertino = "3.3.1"

# —— 图片 / 网络 / 序列化 ——
coil = "3.6.3"
okhttp = "5.5.1"
kotlinxSerialization = "1.13.0"

# —— AI / OCR ——
deepseek = "0.5.0"
mlkitTextChinese = "16.0.1"
markwon = "4.6.2"
jlatexmath = "0.2.0"

# —— 测试 ——
junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
roomTesting = "2.8.5"

[libraries]
# Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntime" }

# Compose（用 BOM 统一版本，不写死子模块版本）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# iOS 风格组件库（Cupertino）
cupertino = { module = "io.github.robinpcrd:cupertino", version.ref = "cupertino" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "roomTesting" }

# 图片
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# 网络 / 序列化
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }

# 相机
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }

# AI / OCR
deepseek-kotlin = { module = "org.oremif:deepseek-kotlin", version.ref = "deepseek" }
mlkit-text-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextChinese" }

# Markdown / LaTeX（P6 用）
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-latex = { module = "io.noties.markwon:ext-latex", version.ref = "markwon" }
jlatexmath-android = { module = "ru.noties:jlatexmath-android", version.ref = "jlatexmath" }

# 安全存储
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
