name: Deploy website to GitHub Pages

# Pages 源是 gh-pages 分支（Deploy from a branch: gh-pages / root）。
# 这里在 main 上把 website/ 子树推到 gh-pages，触发 Pages 重新构建。
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish website to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=website -b site-build
          git push --force origin site-build:gh-pages
