name: Build & Release APK

# 打 tag（v0.3.0 这种）时自动构建 APK 并挂到 GitHub Release。
# App 内「设置 → 检查更新」读的就是这个 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner 自带 Android SDK，直接复用，避免 setup-android 的 sdkmanager 版本坑
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          yes | "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/wrongbook-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1. 这里发布的是 debug 签名 APK，能直接安装升级（同签名覆盖安装）。
# 2. 若要上架或对外分发，建议在仓库 Secrets 里放 keystore，改成 assembleRelease 并配置 signingConfig。
# 3. App 内下载后会校验文件 > 1MB，然后调系统安装器。
