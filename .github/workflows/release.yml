name: Build & Release APK

# 打 tag（v0.4.0 这种）时自动构建 APK 并挂到 GitHub Release。
# App 内「设置 → 检查更新」和「大版本提示弹窗」读的就是这个 Release 的正文。
# 正文优先用 docs/release-notes/<tag>.md（中文更新日志），没有才退回自动生成。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          yes | "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/wrongbook-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      # 更新日志：docs/release-notes/<tag>.md 存在就用它，保证 App 弹窗里是中文说明
      - name: Resolve release notes
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "body_path=$f" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
            echo "使用自定义更新日志: $f"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "没有 $f，使用自动生成的说明"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.custom == 'false' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 发版约定：
# 1. 改 app/build.gradle.kts 的 versionCode(+1) 与 versionName
# 2. 写 docs/release-notes/<tag>.md（这份正文会显示在 App 的更新弹窗里）
# 3. 推 tag，CI 自动构建并发布
