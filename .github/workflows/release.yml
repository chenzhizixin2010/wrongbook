name: Build & Release APK

# 打 tag（v0.4.0 这种）时自动构建 APK 并挂到 GitHub Release。
# App 内「设置 → 检查更新」和「大版本提示弹窗」读的就是这个 Release 的正文。
# 正文优先用 docs/release-notes/<tag>.md（中文更新日志），没有才退回自动生成。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Alpha 内测版（v0.13.A01 这种）不在这里发：它们走 alpha.yml 发到「只有包、没有源码」的仓库
    if: ${{ !contains(github.ref_name, '.A') }}
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          yes | "$SDKMGR" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 版本号守卫：tag 必须和 app/build.gradle.kts 里的 versionName 一致，
      # 否则 App 内「检查更新」会把自己判成旧版本（或永远提示有更新）。
      # Alpha 内测版的 tag 形如 v0.13.A01。
      - name: Verify versionName matches tag
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts \
                 | head -n1 | sed -E 's/.*"(.*)"/\1/')"
          echo "tag=$tag versionName=$ver"
          if [ "${GITHUB_REF_TYPE:-tag}" = "tag" ] && [ "$tag" != "$ver" ]; then
            echo "::error::app/build.gradle.kts 的 versionName ($ver) 与 tag ($tag) 不一致"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/wrongbook-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      # 更新日志：docs/release-notes/<tag>.md 存在就用它，保证 App 弹窗里是中文说明
      - name: Resolve release notes
        id: notes
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "body_path=$f" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
            echo "使用自定义更新日志: $f"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "没有 $f，使用自动生成的说明"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.custom == 'false' }}
          fail_on_unmatched_files: true
          # 0.x 都是测试版，全部标成 pre-release；1.0 以后手动去掉这行。
          # Alpha 内测版（v0.13.A01）也走这条，App 里只有 Alpha 通道能收到。
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 发版约定：
# 1. 改 app/build.gradle.kts 的 versionCode(+1) 与 versionName
#    - 正式版：0.13.0    Beta：0.13.0    Alpha 内测：0.13.A01 / 0.13.A02 …
# 2. 写 docs/release-notes/<tag>.md（这份正文会显示在 App 的更新弹窗里）
# 3. 推 tag，CI 自动构建并发布
