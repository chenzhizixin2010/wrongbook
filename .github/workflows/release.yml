name: Build & Release APK

# 打 tag（v0.3.0 这种）时自动构建 APK 并挂到 GitHub Release。
# App 内「设置 → 检查更新」读的就是这个 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/wrongbook-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1. 这里发布的是 debug 签名 APK，能直接安装升级（同签名覆盖安装）。
# 2. 若要上架或对外分发，建议在仓库 Secrets 里放 keystore，改成 assembleRelease 并配置 signingConfig。
# 3. Release 的 APK 必须是 application/vnd.android.package-archive 能被系统安装的包；
#    App 内下载后会校验文件 > 1MB，然后调系统安装器。
