<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Errata · 开屏设计稿</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{
    background:#0e0f14;color:#eceef6;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:40px 40px 34px;
  }
  h1{font-size:30px;font-weight:600;letter-spacing:-.4px}
  .sub{color:#8f91a3;font-size:13px;margin-top:8px;letter-spacing:.02em}
  .stage{display:flex;gap:54px;justify-content:center;margin-top:34px}
  .col{width:390px}
  .frame{
    width:390px;height:844px;border-radius:56px;background:#0b0b12;padding:10px;position:relative;
    box-shadow:0 34px 90px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .screen{
    position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;
    background:
      radial-gradient(58% 52% at 12% 5%, rgba(106,166,255,.50), transparent 70%),
      radial-gradient(52% 46% at 96% 20%, rgba(192,140,255,.42), transparent 72%),
      radial-gradient(56% 46% at 0% 90%, rgba(79,224,208,.34), transparent 72%),
      radial-gradient(46% 40% at 74% 80%, rgba(255,179,209,.28), transparent 72%),
      linear-gradient(180deg,#F5F7FD 0%,#E9EDF8 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:31px;border-radius:17px;background:#000;z-index:20}
  .status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600;color:#0B0B12;z-index:10}
  .status .right{display:flex;gap:5px;align-items:center;opacity:.9}
  .status .bar{width:17px;height:10px;border:1.3px solid currentColor;border-radius:3px;position:relative}
  .status .bar:after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:11px;background:currentColor;border-radius:1px}
  .glow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.20),transparent 68%);top:50%;left:50%;transform:translate(-50%,-64%)}
  .mark{
    width:128px;height:128px;border-radius:38px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.46));
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 24px 54px rgba(27,42,94,.18), inset 0 1px 0 #fff;
    backdrop-filter:blur(24px) saturate(1.2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  .bar{height:14px;border-radius:8px;background:linear-gradient(90deg,#0A84FF,#6C5CE7)}
  .bar.b1,.bar.b3{width:76px}
  .bar.b2{width:52px;align-self:flex-start;margin-left:26px}
  .word{
    margin-top:34px;font-family:"Times New Roman","Songti SC",serif;
    font-size:48px;line-height:56px;letter-spacing:-.8px;color:#0B0B12;
  }
  .meta{display:flex;align-items:center;gap:10px;margin-top:18px}
  .rule{width:22px;height:1px}
  .rule.l{background:linear-gradient(90deg,transparent,rgba(10,132,255,.7))}
  .rule.r{background:linear-gradient(90deg,rgba(10,132,255,.7),transparent)}
  .subtitle{font-size:9.5px;letter-spacing:2.2px;color:#6B6B7B;font-weight:500}
  .tag{margin-top:22px;font-size:13px;letter-spacing:.4px;color:#6B6B7B}
  .footer{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.6px;color:rgba(107,107,123,.8)}
  .caption{margin-top:18px;text-align:center;font-size:13px;color:#9a9aa8;letter-spacing:.04em}

  /* 深色 */
  .frame.dark .screen{
    background:
      radial-gradient(58% 52% at 12% 5%, rgba(11,42,111,.95), transparent 70%),
      radial-gradient(52% 46% at 96% 20%, rgba(43,20,102,.85), transparent 72%),
      radial-gradient(56% 46% at 0% 90%, rgba(18,63,60,.72), transparent 72%),
      radial-gradient(46% 40% at 74% 80%, rgba(26,13,61,.6), transparent 72%),
      linear-gradient(180deg,#08090F 0%,#04050A 100%);
  }
  .frame.dark .status{color:#F5F5FA}
  .frame.dark .mark{
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border-color:rgba(255,255,255,.45);
    box-shadow:0 24px 54px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .frame.dark .word{color:#F5F5FA}
  .frame.dark .subtitle,.frame.dark .tag{color:#9C9CB0}
  .frame.dark .footer{color:rgba(156,156,176,.8)}
  .frame.dark .glow{background:radial-gradient(circle,rgba(61,139,255,.28),transparent 68%)}
</style>
</head>
<body>
  <h1>Errata · 开屏</h1>
  <div class="sub">系统启动窗口（品牌标记）→ 1.2s 品牌页 → 420ms 淡出到主界面 ｜ 128dp 玻璃标记 + 衬线字标</div>

  <div class="stage">
    <div class="col">
      <div class="frame">
        <div class="island"></div>
        <div class="status"><span>9:41</span><span class="right"><span>∥∥</span><span class="bar"></span></span></div>
        <div class="screen">
          <div class="glow"></div>
          <div class="mark"><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
          <div class="word">Errata</div>
          <div class="meta">
            <span class="rule l"></span>
            <span class="subtitle">AI MISTAKE NOTEBOOK</span>
            <span class="rule r"></span>
          </div>
          <div class="tag">把每一道错题，改对。</div>
          <div class="footer">本地优先 · 离线可用</div>
        </div>
      </div>
      <div class="caption">浅色模式</div>
    </div>

    <div class="col">
      <div class="frame dark">
        <div class="island"></div>
        <div class="status"><span>9:41</span><span class="right"><span>∥∥</span><span class="bar"></span></span></div>
        <div class="screen">
          <div class="glow"></div>
          <div class="mark"><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span></div>
          <div class="word">Errata</div>
          <div class="meta">
            <span class="rule l"></span>
            <span class="subtitle">AI MISTAKE NOTEBOOK</span>
            <span class="rule r"></span>
          </div>
          <div class="tag">把每一道错题，改对。</div>
          <div class="footer">本地优先 · 离线可用</div>
        </div>
      </div>
      <div class="caption">深色模式</div>
    </div>
  </div>
</body>
</html>
