org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目路径含中文（D:\错题整理app），AGP 默认会拒绝构建并提示迁移目录。
# 实测 aapt2 / javac / KSP 在中文路径下可正常工作，故显式关闭该检查。
# 若将来遇到资源编译或 NDK 相关的诡异路径错误，优先把项目移到纯英文路径。
android.overridePathCheck=true

# AGP 9 默认启用内置 Kotlin，但当前 KSP 版本尚不兼容内置 Kotlin 模式。
# 这里显式退回「传统 Kotlin 插件」模式（AGP 10 之前仍支持）：
# 两个开关必须同时设置，只设一个会出现「Compose Compiler plugin is required」之类的连锁错误。
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
